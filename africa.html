<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Continent Content</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Africa</h1> 
    <table>
        <thead>
            <tr>
                <th>Flag</th>
                <th>Country Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="flags/algeria.png" alt="Algeria Flag"></td>
                <td>Algeria</td>
            </tr>
            <tr>
                <td><img src="flags/angola.png" alt="Angola Flag"></td>
                <td>Angola</td>
            </tr>
            <tr>
                <td><img src="flags/egypt.png" alt="Egypt Flag"></td>
                <td>Egypt</td>
            </tr>
            <tr>
                <td><img src="flags/ghana.png" alt="Ghana Flag"></td>
                <td>Ghana</td>
            </tr>
            <tr>
                <td><img src="flags/kenya.png" alt="Kenya Flag"></td>
                <td>Kenya</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
