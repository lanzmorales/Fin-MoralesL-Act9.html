<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Sidebar Menu</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <style>
        body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: #0f172a; /* Dark navy matching the table headers */
  color: #f8fafc;
  margin: 0;
  padding: 24px 16px;
  box-sizing: border-box;
}

/* Sidebar Title */
h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8; /* Soft muted gray */
  margin: 0 0 16px 8px;
}

/* Navigation List */
ul {
  list-style-type: none;
  padding: 0;
  margin: 0;
}

li {
  margin-bottom: 6px;
}

/* Menu Links */
ul li a {
  display: block;
  padding: 10px 14px;
  color: #e2e8f0;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 8px;
  transition: all 0.2s ease;
}

/* Hover & Active States */
ul li a:hover {
  background-color: #1e293b; /* Slightly lighter slate blue */
  color: #ffffff;
  transform: translateX(4px); /* Subtle slide effect */
}

ul li a:active,
ul li a:focus {
  background-color: #3b82f6; /* Accent blue for selected item */
  color: #ffffff;
  outline: none;
}
    </style>
    <body>
        <h3>Select a Continent</h3>
    <ul>
        <li><a href="africa.html" target="viewing-screen">Africa</a></li>
        <li><a href="asia.html" target="viewing-screen">Asia</a></li>
        <li><a href="europe.html" target="viewing-screen">Europe</a></li>
        <li><a href="north-america.html" target="viewing-screen">North America</a></li>
        <li><a href="south-america.html" target="viewing-screen">South America</a></li>
        <li><a href="oceania.html" target="viewing-screen">Oceania</a></li>
        
    </ul>
    </body>
    </html>
